openapi: 3.0.3 
info: 
  title: Shop API 
  version: 1.0.0
  license:
    name: Proprietary
    url: https://api.shop.example/license
  description: |
    ## Назначение 
    REST API интернет-магазина: каталоги, категории, товары, заказы. 
    ## Ошибки
    Все ошибки — `application/problem+json` (RFC 9457).
    | HTTP | type | Когда |
    |------|------|-------|
    | 400 | https://api.shop.example/errors/bad-request | не-JSON, битый uuid |
    | 401 | https://api.shop.example/errors/unauthorized | нет токена / просрочен |
    | 403 | https://api.shop.example/errors/forbidden | нет нужного scope |
    | 404 | https://api.shop.example/errors/not-found | ресурс не существует |
    | 409 | https://api.shop.example/errors/sku-duplicate | дубликат SKU |
    | 409 | https://api.shop.example/errors/catalog-has-categories | удаление каталога с категориями |
    | 409 | https://api.shop.example/errors/idempotency-key-reuse | Idempotency-Key с другим телом |
    | 422 | https://api.shop.example/errors/product-out-of-stock | товар stock = 0 |
    | 422 | https://api.shop.example/errors/invalid-status-transition | недопустимый переход статуса |
    | 429 | https://api.shop.example/errors/too-many-requests | превышен лимит |
    | 500 | https://api.shop.example/errors/internal-server-error | непредвиденная ошибка |
    ## Версионирование
    URI-версионирование: текущая версия — `/v1`. Аддитивные изменения
    (новые поля, эндпоинты) — без смены версии. Ломающие (переименование,
    смена типов, удаление) — `/v2`; старая версия живёт ≥ 6 месяцев
    с заголовками `Deprecation: true` и `Sunset: <RFC 1123 date>`.
    ## Идемпотентность
    `POST /v1/orders` (и опционально `POST /v1/products`) принимает заголовок
    `Idempotency-Key` (UUID). Повтор с тем же ключом и телом за 24 часа →
    сохранённый результат первого (201). Тот же ключ, другое тело → 409.
    Без ключа — запрос принимается, но гарантий нет.
    ## Rate limit
    Лимит — 100 запросов в минуту на токен. При превышении — 429
    с заголовками `Retry-After`, `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset`. 
    ## Стиль
    Все параметры и поля — camelCase (`catalogId`, `categoryIdFilter`, `isActive`).
  contact: 
    name: API Team 
    email: api@shop.example 
servers: 
  - url: https://staging.api.shop.example/v1 
    description: Staging 
  - url: https://api.shop.example/v1 
    description: Production 
tags: 
  - name: catalogs 
    description: Управление каталогами 
  - name: categories 
    description: Иерархия категорий внутри каталогов 
  - name: products 
    description: Карточки товаров 
  - name: orders 
    description: Оформление и обработка заказов 
security: 
  - bearerAuth: [] 
paths:
  /catalogs:
    get:
      tags: [catalogs]
      operationId: listCatalogs
      summary: Список каталогов
      description: |
        Постраничный список каталогов.
        
        Коды: 200, 400, 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список каталогов
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CatalogList'
              example:
                data:
                  - id: 1
                    name: Электроника
                    slug: electronics
                    description: Электроника и гаджеты
                    isActive: true
                    createdAt: '2026-01-15T10:00:00Z'
                    updatedAt: '2026-01-20T12:30:00Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 3
                  totalPages: 1
                  hasNext: false
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalogs/{catalogId}:
    parameters:
      - $ref: '#/components/parameters/catalogId'
    get:
      tags: [catalogs]
      operationId: getCatalog
      summary: Получить каталог
      description: |
        Возвращает каталог по идентификатору.
        
        Коды: 200, 400, 404, 429, 500.
      security: []
      responses:
        '200':
          description: Каталог
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Catalog'
              example:
                id: 1
                name: Электроника
                slug: electronics
                description: Электроника и гаджеты
                isActive: true
                createdAt: '2026-01-15T10:00:00Z'
                updatedAt: '2026-01-20T12:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /catalogs/{catalogId}/categories:
    parameters:
      - $ref: '#/components/parameters/catalogId'
    get:
      tags: [categories]
      operationId: listCategoriesByCatalog
      summary: Категории каталога
      description: |
        Постраничный список категорий внутри каталога.
        
        Коды: 200, 400, 404, 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список категорий каталога
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CategoryList'
              example:
                data:
                  - id: 7
                    catalogId: 1
                    name: Ноутбуки
                    slug: laptops
                    imageUrl: https://cdn.shop.example/categories/laptops.png
                    sortOrder: 10
                    isActive: true
                    createdAt: '2026-01-15T10:00:00Z'
                    updatedAt: '2026-01-20T12:30:00Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 3
                  totalPages: 1
                  hasNext: false
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /categories:
    get:
      tags: [categories]
      operationId: listCategories
      summary: Список категорий
      description: |
        Постраничный список всех категорий с опциональным фильтром по каталогу.
        
        Коды: 200, 400, 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/categoryIdFilter'
      responses:
        '200':
          description: Список категорий
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/CategoryList'
              example:
                data:
                  - id: 7
                    catalogId: 1
                    name: Ноутбуки
                    slug: laptops
                    sortOrder: 10
                    isActive: true
                    createdAt: '2026-01-15T10:00:00Z'
                    updatedAt: '2026-01-20T12:30:00Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 25
                  totalPages: 2
                  hasNext: true
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products:
    get:
      tags: [products]
      operationId: listProducts
      summary: Список товаров
      description: |
        Постраничный список товаров с фильтрами:
        q — поиск по name/sku (≥ 2 символов);
        categoryIdFilter — фильтр по категории;
        statusFilter — draft | active | archived;
        minPriceFilter / maxPriceFilter — диапазон цены в рублях;
        sort — name | price | createdAt (default createdAt);
        direction — asc | desc (default desc).
        
        Коды: 200, 400, 429, 500.
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/categoryIdFilter'
        - $ref: '#/components/parameters/statusFilter'
        - $ref: '#/components/parameters/minPriceFilter'
        - $ref: '#/components/parameters/maxPriceFilter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/direction'
      responses:
        '200':
          description: Список товаров
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/ProductList'
              example:
                data:
                  - id: 0cd50bbd-116e-40a5-8972-16a92135e201
                    sku: NB-IGR-156
                    name: Игровой ноутбук 15.6"
                    description: Мощный игровой ноутбук с RTX 4080
                    categoryId: 7
                    price: 119999
                    stock: 12
                    status: active
                    images:
                      - https://cdn.shop.example/products/nb-igr-1.png
                    createdAt: '2026-01-15T10:00:00Z'
                    updatedAt: '2026-01-20T12:00:00Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 137
                  totalPages: 7
                  hasNext: true
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [products]
      operationId: createProduct
      summary: Создать товар
      description: |
        Создаёт товар. SKU уникален — нарушение даёт 409.
        Категория должна существовать и быть isActive: true — иначе 422.
        Поддерживает Idempotency-Key (опционально).
        Без ключа — запрос принимается, но гарантий идемпотентности нет.
        
        Коды: 201, 400, 401, 403, 409, 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              sku: NB-IGR-156
              name: Игровой ноутбук 15.6"
              description: Мощный игровой ноутбук с RTX 4080
              categoryId: 7
              price: 119999
              stock: 12
              status: active
              images:
                - https://cdn.shop.example/products/nb-igr-1.png
      responses:
        '201':
          description: Товар создан
          headers:
            Location:
              description: URI созданного товара
              schema:
                type: string
                format: uri
              example: /v1/products/0cd50bbd-116e-40a5-8972-16a92135e201
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 0cd50bbd-116e-40a5-8972-16a92135e201
                sku: NB-IGR-156
                name: Игровой ноутбук 15.6"
                description: Мощный игровой ноутбук с RTX 4080
                categoryId: 7
                price: 119999
                stock: 12
                status: active
                images:
                  - https://cdn.shop.example/products/nb-igr-1.png
                createdAt: '2026-01-15T10:00:00Z'
                updatedAt: '2026-01-15T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/productId'
    get:
      tags: [products]
      operationId: getProduct
      summary: Получить товар
      description: |
        Возвращает товар по UUID. Если значение не UUID — 400.
        
        Коды: 200, 400, 404, 429, 500.
      security: []
      responses:
        '200':
          description: Товар
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 0cd50bbd-116e-40a5-8972-16a92135e201
                sku: NB-IGR-156
                name: Игровой ноутбук 15.6"
                description: Мощный игровой ноутбук с RTX 4080
                categoryId: 7
                price: 119999
                stock: 12
                status: active
                images:
                  - https://cdn.shop.example/products/nb-igr-1.png
                createdAt: '2026-01-15T10:00:00Z'
                updatedAt: '2026-01-20T12:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [products]
      operationId: replaceProduct
      summary: Полностью заменить товар
      description: |
        Полная замена товара. Все поля, кроме readOnly, обязательны.
        
        Коды: 200, 400, 401, 403, 404, 409, 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
            example:
              sku: NB-IGR-156
              name: Игровой ноутбук 15.6"
              description: Обновлённое описание
              categoryId: 7
              price: 129999
              stock: 10
              status: active
      responses:
        '200':
          description: Товар заменён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 0cd50bbd-116e-40a5-8972-16a92135e201
                sku: NB-IGR-156
                name: Игровой ноутбук 15.6"
                description: Обновлённое описание
                categoryId: 7
                price: 129999
                stock: 10
                status: active
                createdAt: '2026-01-15T10:00:00Z'
                updatedAt: '2026-01-20T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [products]
      operationId: updateProduct
      summary: Частично обновить товар
      description: |
        JSON Merge Patch (RFC 7386). Все поля optional.
        
        Коды: 200, 400, 401, 403, 404, 409, 422, 429, 500.
      security:
        - bearerAuth: [products:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
            example:
              price: 129999
              stock: 10
      responses:
        '200':
          description: Товар обновлён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 0cd50bbd-116e-40a5-8972-16a92135e201
                sku: NB-IGR-156
                name: Игровой ноутбук 15.6"
                categoryId: 7
                price: 129999
                stock: 10
                status: active
                createdAt: '2026-01-15T10:00:00Z'
                updatedAt: '2026-01-20T14:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [products]
      operationId: deleteProduct
      summary: Удалить товар
      description: |
        Удаляет товар.
        
        Коды: 204, 400, 401, 403, 404, 429, 500.
      security:
        - bearerAuth: [products:write]
      responses:
        '204':
          description: Товар удалён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders:
    get:
      tags: [orders]
      operationId: listOrders
      summary: Список заказов
      description: |
        Постраничный список заказов текущего пользователя.
        
        Коды: 200, 400, 401, 403, 429, 500.
      security:
        - bearerAuth: [orders:read]
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Список заказов
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/OrderList'
              example:
                data:
                  - id: 42
                    number: ORD-2026-000042
                    status: pending
                    totalAmount: 29998
                    customer:
                      name: Иван Иванов Иванович
                      email: ivan@example.com
                      phone: '+79123456789'
                    items:
                      - productId: a340e259-f87a-4938-be5d-7c5eb789b252
                        quantity: 2
                        unitPrice: 55999
                    createdAt: '2026-01-20T10:00:00Z'
                    updatedAt: '2026-01-20T10:00:00Z'
                pagination:
                  page: 1
                  limit: 20
                  totalItems: 5
                  totalPages: 1
                  hasNext: false
                  hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [orders]
      operationId: createOrder
      summary: Создать заказ
      description: |
        Создаёт заказ. Цены фиксируются копией unitPrice на момент создания.
        Поле status в запросе не передаётся — сервер ставит pending.
        Поле totalAmount считает сервер.
        
        Идемпотентность: заголовок Idempotency-Key (UUID) опционален.
        Повтор с тем же ключом и телом — сохранённый результат (201).
        Тот же ключ, другое тело — 409 (idempotency-key-reuse).
        Без ключа — запрос принимается, но гарантий нет.

        422: товар не active, stock = 0, несуществующий productId.
        
        Коды: 201, 400, 401, 403, 409, 422, 429, 500.
      security:
        - bearerAuth: [orders:write]
      parameters:
        - $ref: '#/components/parameters/Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            example:
              customer:
                name: Иван Иванов Иванович
                email: ivan@example.com
                phone: '+79123456789'
              items:
                - productId: a340e259-f87a-4938-be5d-7c5eb789b252
                  quantity: 2
      responses:
        '201':
          description: Заказ создан
          headers:
            Location:
              description: URI созданного заказа
              schema:
                type: string
                format: uri
              example: /v1/orders/42
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 42
                number: ORD-2026-000042
                status: pending
                totalAmount: 29998
                customer:
                  name: Иван Иванов Иванович
                  email: ivan@example.com
                  phone: '+79123456789'
                items:
                  - productId: a340e259-f87a-4938-be5d-7c5eb789b252
                    quantity: 2
                    unitPrice: 55999
                createdAt: '2026-01-20T10:00:00Z'
                updatedAt: '2026-01-20T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/orderId'
    get:
      tags: [orders]
      operationId: getOrder
      summary: Получить заказ
      description: |
        Возвращает заказ по идентификатору.
        
        Коды: 200, 400, 401, 403, 404, 429, 500.
      security:
        - bearerAuth: [orders:read]
      responses:
        '200':
          description: Заказ
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 42
                number: ORD-2026-000042
                status: pending
                totalAmount: 29998
                customer:
                  name: Иван Иванов Иванович
                  email: ivan@example.com
                  phone: '+79123456789'
                items:
                  - productId: a340e259-f87a-4938-be5d-7c5eb789b252
                    quantity: 2
                    unitPrice: 55999
                createdAt: '2026-01-20T10:00:00Z'
                updatedAt: '2026-01-20T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/orderId'
    patch:
      tags: [orders]
      operationId: updateOrderStatus
      summary: Изменить статус заказа
      description: |
        Меняет статус заказа. Матрица допустимых переходов:
        pending → confirmed, cancelled;
        confirmed → shipped, cancelled;
        shipped → delivered;
        delivered — финальный;
        cancelled — финальный.
        Недопустимый переход — 422 (type: .../invalid-status-transition).
        
        Коды: 200, 400, 401, 403, 404, 422, 429, 500.
      security:
        - bearerAuth: [orders:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
            example:
              status: confirmed
      responses:
        '200':
          description: Статус обновлён
          content:
            application/json; charset=utf-8:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                id: 42
                number: ORD-2026-000042
                status: confirmed
                totalAmount: 29998
                customer:
                  name: Иван Иванов Иванович
                  email: ivan@example.com
                  phone: '+79123456789'
                items:
                  - productId: a340e259-f87a-4938-be5d-7c5eb789b252
                    quantity: 2
                    unitPrice: 55999
                createdAt: '2026-01-20T10:00:00Z'
                updatedAt: '2026-01-20T10:10:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT-токен. Scopes: catalogs:read, catalogs:write,
        products:read, products:write, orders:read, orders:write.
  parameters:
    page: 
      name: page 
      in: query 
      description: Номер страницы 
      required: false 
      schema: 
        type: integer 
        format: int32 
        minimum: 1 
        default: 1 
      example: 5
    limit: 
      name: limit 
      in: query 
      description: Размер страницы 
      required: false 
      schema: 
        type: integer 
        format: int32 
        minimum: 1 
        maximum: 100 
        default: 20 
      example: 30
    Idempotency-Key:
      name: Idempotency-Key
      in: header
      description: |
        Ключ идемпотентности. Без ключа — запрос принимается, но гарантии нет
      required: false
      schema:
        type: string
        format: uuid
      example: ce2786f4-1f63-4fd7-8087-7d875edf442c
    catalogId: 
      name: catalogId
      in: path
      description: Айди каталога
      required: true 
      schema: 
        type: integer 
        format: int64 
        minimum: 1
      example: 3
    productId: 
      name: productId
      in: path
      description: Айди товара
      required: true 
      schema: 
        type: string
        format: uuid 
      example: 1076feb3-da8a-4b71-aae3-44b416fe57c7
    orderId: 
      name: orderId
      in: path
      description: Айди заказа
      required: true 
      schema: 
        type: integer
        format: int64
        minimum: 1
      example: 55
    q:
      name: q
      in: query
      required: false
      description: Поиск по name/sku, ≥ 2 символа
      schema:
        type: string
        minLength: 2
      example: ноутбук
    categoryIdFilter:
      name: categoryIdFilter
      in: query
      required: false
      description: Фильтр по категории
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 31
    statusFilter:
      name: statusFilter
      in: query
      required: false
      description: Фильтр по статусу
      schema:
        type: string
        enum: [draft, active, archived]
      example: active
    minPriceFilter:
      name: minPriceFilter
      in: query
      required: false
      description: Мин цена в рублях
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 10000000
      example: 25000
    maxPriceFilter:
      name: maxPriceFilter
      in: query
      required: false
      description: Макс цена в рублях
      schema:
        type: integer
        format: int64
        minimum: 0
        maximum: 10000000
      example: 72000
    sort:
      name: sort
      in: query
      required: false
      description: Сортировка
      schema:
        type: string
        enum: [name, price, createdAt]
        default: createdAt
      example: price
    direction:
      name: direction
      in: query
      required: false
      description: Направление
      schema:
        type: string
        enum: [asc, desc]
        default: desc
      example: asc
  headers: 
    X-RateLimit-Limit:
      description: Макс число запросов
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 100
    X-RateLimit-Remaining:
      description: Сколько запросов осталось
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 67
    X-RateLimit-Reset:
      description: Unix время (сек, UTC), когда окно сбросится и лимит восстановится
      schema:
        type: integer
        format: int64
      example: 1773849600
    Retry-After:
      description: Через сколько сек можно повторить запрос
      schema:
        type: integer
        format: int32
        minimum: 0
      example: 30
  responses:
    BadRequest:
      description: Некорректный запрос (не-JSON, битый uuid в пути)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/bad-request
            title: Bad request
            status: 400
            detail: "productId is not a valid uuid: '56'"
            instance: /v1/products/56
    Unauthorized:
      description: Токен отсутствует или просрочен
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/unauthorized
            title: Unauthorized
            status: 401
            detail: Missing or expired bearer token
            instance: /v1/orders
    Forbidden:
      description: Токен валиден, но не содержит нужного scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/forbidden
            title: Forbidden
            status: 403
            detail: "Token is missing required scope: orders:read"
            instance: /v1/orders
    NotFound: 
      description: Ресурс не найден 
      content: 
        application/problem+json: 
          schema: 
            $ref: '#/components/schemas/Error' 
          example: 
            type: https://api.shop.example/errors/not-found 
            title: Not found 
            status: 404 
            detail: Resource was not found 
            instance: /v1/products/3fa85f64-5717-4562-b3fc-2c963f66afa6
    Conflict: 
      description: |
        Конфликт состояния/уникальности: Дубликат sku; Удаление каталога с категориями; Idempotency-Key с другим телом
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            SkuDuplicate:
              summary: Дубликат SKU
              value:
                type: https://api.shop.example/errors/sku-duplicate
                title: SKU already exists
                status: 409
                detail: SKU already exists
                instance: /v1/products
            CatalogHasCategories:
              summary: Удаление каталога с категориями
              value:
                type: https://api.shop.example/errors/catalog-has-categories
                title: Catalog has categories
                status: 409
                detail: "Catalog 1 cannot be deleted: it contains 3 categories"
                instance: /v1/catalogs/1
            IdempotencyKeyReuse:
              summary: Idempotency-Key с другим телом
              value:
                type: https://api.shop.example/errors/idempotency-key-reuse
                title: Idempotency-Key reuse with different body
                status: 409
                detail: "Key 7b3e2f9a-1c4d-4a8e-9f21-2c963f66afa6 was used with another request body"
                instance: /v1/orders
    UnprocessableEntity:
      description: |
        Тело валидно по схеме, но нарушает бизнес-правило:
        Товар stock: 0 в заказе; Товар не active; Недопустимый переход статуса
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          examples:
            ProductOutOfStock:
              summary: Товар отсутствует
              value:
                type: https://api.shop.example/errors/product-out-of-stock
                title: Product out of stock
                status: 422
                detail: "Product 0cd50bbd-116e-40a5-8972-16a92135e201 has stock = 0"
                instance: /v1/orders
                errors:
                  - field: items[0].productId
                    code: out_of_stock
                    message: Product is not available for ordering
            InvalidStatusTransition:
              summary: Недопустимый переход статуса
              value:
                type: https://api.shop.example/errors/invalid-status-transition
                title: Invalid status transition
                status: 422
                detail: "Cannot transition order 42 from 'delivered' to 'pending'"
                instance: /v1/orders/42/status
                errors:
                  - field: status
                    code: invalid_transition
                    message: "'delivered' is final"
    TooManyRequests:
      description: |
        Превышен лимит (100 req/min на токен).
        Обязателен заголовок Retry-After (секунды)
      headers:
        Retry-After:
          $ref: '#/components/headers/Retry-After'
        X-RateLimit-Limit:
          $ref: '#/components/headers/X-RateLimit-Limit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/X-RateLimit-Remaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/X-RateLimit-Reset'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/too-many-requests
            title: Too many requests
            status: 429
            detail: Rate limit exceeded.
            instance: /v1/products
    InternalServerError:
      description: Непредвиденная ошибка сервера
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            type: https://api.shop.example/errors/internal-server-error
            title: Internal server error
            status: 500
            detail: An unexpected error occurred
            instance: /v1/products
  schemas: 
    Error: 
      type: object 
      required: [type, title, status, detail, instance] 
      properties: 
        type: 
          type: string 
          format: uri 
          description: URI типа ошибки 
        title: 
          type: string 
          description: Краткое человекочитаемое описание 
        status: 
          type: integer 
          description: HTTP-код 
        detail: 
          type: string 
          description: "Контекст: что именно не так" 
        instance: 
          type: string 
          description: URI запроса, вызвавшего ошибку 
        errors: 
          type: array 
          description: Полевые ошибки (обязателен при 422) 
          items:
            $ref: '#/components/schemas/ErrorItem'
    ErrorItem:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
          description: Путь к полю (JSON Pointer или dot-notation)
          example: items[0].productId
        code:
          type: string
          description: Машиночитаемый код ошибки
          example: out_of_stock
        message:
          type: string
          description: Человекочитаемое сообщение
          example: Product is not available for ordering
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [errors]
    Pagination: 
      type: object
      required: [page, limit, totalItems, totalPages, hasNext, hasPrev]
      properties:
        page:
          type: integer
          format: int32
          minimum: 1
          description: Текущая страница
          example: 1
        limit:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          description: Размер страницы
          example: 20
        totalItems:
          type: integer
          format: int64
          minimum: 0
          description: Всего элементов во всей выборке
          example: 137
        totalPages:
          type: integer
          format: int32
          minimum: 0
          description: Всего страниц при текущем limit
          example: 7
        hasNext:
          type: boolean
          description: Есть ли следующая страница
          example: true
        hasPrev:
          type: boolean
          description: Есть ли предыдущая страница
          example: false
    CatalogList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Массив каталогов на текущей странице
          items:
            $ref: '#/components/schemas/Catalog'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CategoryList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Массив категорий на текущей странице
          items:
            $ref: '#/components/schemas/Category'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ProductList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Массив товаров на текущей странице
          items:
            $ref: '#/components/schemas/Product'
        pagination:
          $ref: '#/components/schemas/Pagination'
    OrderList:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          description: Массив заказов на текущей странице
          items:
            $ref: '#/components/schemas/Order'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Catalog:
      type: object
      required: [id, name, slug, isActive, createdAt, updatedAt]
      properties: 
        id:
          type: integer
          format: int64
          minimum: 1
          description: Айди каталога (генерируется сервером)
          example: 1
        name:
          type: string
          minLength: 3
          maxLength: 100
          description: Название каталога
          example: Электроника
        slug:
          type: string
          minLength: 2
          maxLength: 60
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: URL-идентификатор (уникален)
          example: electronics
        description:
          type: string
          minLength: 0 
          maxLength: 500
          description: Описание каталога
          example: Электроника и гаджеты
        isActive:
          type: boolean
          default: true
          description: Активен ли каталог
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата создания (только в ответе)
          example: '2026-01-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Дата обновления (только в ответе)
          example: '2026-01-20T12:30:00Z'
    Category:
      type: object
      required: [id, catalogId, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Айди категории (генерируется сервером)
          example: 7
        catalogId:
          type: integer
          format: int64
          minimum: 1
          description: Айди каталога (должен существовать, иначе 422)
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Название категории
          example: Ноутбуки
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          description: URL-идентификатор (уникален)
          example: laptops
        imageUrl:
          type: string
          format: uri
          description: Ссылка на изображение категории
          example: https://cdn.shop.example/categories/laptops.png
        sortOrder:
          type: integer
          format: int32
          default: 0
          description: Порядок сортировки внутри каталога
          example: 10
        isActive:
          type: boolean
          default: true
          description: Активна ли категория
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-20T12:30:00Z'
    Product:
      type: object
      required: [id, sku, name, categoryId, price, stock, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Айди товара (генерируется сервером (v4))
          example: 0cd50bbd-116e-40a5-8972-16a92135e201
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          description: Артикул (уникален, нарушение — 409)
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          description: Название товара
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          description: Описание товара
          example: Мощный игровой ноутбук с RTX 4080
        categoryId:
          type: integer
          format: int64
          minimum: 1
          description: 'Категория. Должна существовать и быть isActive: true, иначе 422'
          example: 7
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          description: Цена в рублях (целое число)
          example: 119999
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          description: Остаток на складе
          example: 12
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
          description: Статус товара
          example: active
        images:
          type: array
          maxItems: 10
          description: Ссылки на изображения (0–10).
          items:
            type: string
            format: uri
          example:
            - https://cdn.shop.example/products/nb-igr-1.png
            - https://cdn.shop.example/products/nb-igr-2.png
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-20T12:00:00Z'
    Order:
      type: object
      required: [id, number, customer, items, status, totalAmount, createdAt, updatedAt]
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
          description: Идентификатор заказа
          example: 42
        number:
          type: string
          pattern: '^ORD-\d{4}-\d{6}$'
          readOnly: true
          description: Номер заказа (генерируется сервером)
          example: ORD-2026-000042
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          description: Позиции заказа (1–100).
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
          default: pending
          description: |
            Статус заказа, при создании не передаётся — сервер ставит pending.
            Переходы: pending — confirmed — shipped — delivered, 
            pending/confirmed — cancelled (delivered и cancelled — финальные)
          example: pending
        totalAmount:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: сумма unitPrice × quantity по items, в рублях, считается сервером 
          example: 29998
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-20T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2026-01-20T12:00:00Z'
    Customer:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
          description: Имя покупателя
          example: Иван Иванов Иванович
        email:
          type: string
          format: email
          description: Email покупателя
          example: ivan@example.com
        phone:
          type: string
          pattern: '^\+[1-9]\d{6,14}$'
          description: 'Телефон в формате E.164:^\+[1-9]\d{6,14}$' 
          example: '+79123456789'
    OrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          type: string
          format: uuid
          description: 'товар существует, status: active, stock > 0, иначе 422' 
          example: a340e259-f87a-4938-be5d-7c5eb789b252
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          description: Количество
          example: 2
        unitPrice:
          type: integer
          format: int64
          minimum: 0
          readOnly: true
          description: |
            Цена за единицу на момент оформления. Не передаётся клиентом — сервер копирует Product.price на момент создания заказа. В схеме запроса этого поля нет — это принципиально
          example: 55999
    ProductCreate:
      type: object
      required: [sku, name, categoryId, price, stock]
      properties:
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          description: Артикул. (Уникален, нарушение — 409)
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          example: Мощный игровой ноутбук с RTX 4060
        categoryId:
          type: integer
          format: int64
          minimum: 1
          description: 'Категория. Должна существовать и быть isActive: true, иначе 422'
          example: 7
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          description: Цена в рублях
          example: 119999
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          example: 12
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
          example: active
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          example:
            - https://cdn.shop.example/products/nb-igr-156-1.png
    OrderItemCreate:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          format: uuid
          description: Товар. Должен быть active и stock > 0, иначе 422
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 999
          example: 2
    OrderCreate:
      type: object
      required: [customer, items]
      properties:
        customer:
          $ref: '#/components/schemas/Customer'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderItemCreate'
    ProductUpdate:
      type: object
      properties:
        sku:
          type: string
          minLength: 5
          maxLength: 32
          pattern: '^[A-Z0-9-]+$'
          example: NB-IGR-156
        name:
          type: string
          minLength: 2
          maxLength: 200
          example: Игровой ноутбук 15.6"
        description:
          type: string
          maxLength: 5000
          example: Обновлённое описание
        categoryId:
          type: integer
          format: int64
          minimum: 1
          example: 7
        price:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          example: 119999
        stock:
          type: integer
          format: int32
          minimum: 0
          maximum: 1000000
          example: 10
        status:
          type: string
          enum: [draft, active, archived]
          example: active
        images:
          type: array
          maxItems: 10
          items:
            type: string
            format: uri
          example:
            - https://cdn.shop.example/products/nb-igr-156-1.png
    OrderStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [confirmed, shipped, delivered, cancelled]
          description: |
            Новый статус.
            Переходы: pending — confirmed — shipped — delivered, 
            pending/confirmed — cancelled (delivered и cancelled — финальные)
            Недопустимый переход — 422
          example: confirmed